services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: stars
      POSTGRES_PASSWORD: stars
      POSTGRES_DB: stars_dev
    ports:
      - '5432:5432'
    volumes:
      - stars_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

volumes:
  stars_postgres_data:
