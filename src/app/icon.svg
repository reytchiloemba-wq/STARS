<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="stars-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="35%" stop-color="#3B82F6" />
      <stop offset="70%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#D946EF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background rounded square with subtle border -->
  <rect width="32" height="32" rx="8" fill="#0B0F19" />
  <rect width="32" height="32" rx="8" fill="none" stroke="url(#stars-grad)" stroke-width="1" stroke-opacity="0.35" />
  
  <!-- Aerodynamic S-curve with central four-pointed star -->
  <path d="M 23 9.5 C 21.5 7.5 18 7 15 7 C 10.5 7 8 9.5 8 13 C 8 18 24 14.5 24 20 C 24 23.5 21 25.5 16 25.5 C 12.5 25.5 9.5 24 8 22" 
        fill="none" 
        stroke="url(#stars-grad)" 
        stroke-width="2.6" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)" />
  
  <!-- Central four-point diamond star -->
  <polygon points="16,13.5 17.5,16.5 20.5,16.5 18,18.5 19,21.5 16,19.5 13,21.5 14,18.5 11.5,16.5 14.5,16.5" 
           fill="#FFFFFF" 
           opacity="0.9" />
</svg>
